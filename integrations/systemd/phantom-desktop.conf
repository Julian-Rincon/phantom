# Drop-in for codeg.service: keep Phantom (and the agent processes it
# spawns inside its cgroup) a polite neighbour of the Plasma session.
#
# - Interactive apps keep priority: default weight is 100, so under contention
#   Plasma/KWin and the foreground app get roughly twice the CPU/IO share.
#   With no contention the agents still use the whole machine.
# - MemoryHigh throttles and reclaims instead of letting agent runs push the
#   desktop into swap; there is deliberately no MemoryMax (no OOM kills of a
#   running agent turn).
# - A crash loop stops after 5 failures in 2 minutes instead of restarting
#   forever in the background.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
CPUWeight=50
IOWeight=50
MemoryHigh=8G
Nice=5
