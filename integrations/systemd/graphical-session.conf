# Phantom starts at login, before Plasma exports its display variables to
# the systemd user manager, so agent tools it spawns (spectacle, kdialog,
# wl-copy, notify-send…) were born without a display and aborted. Pin the
# Plasma Wayland session's values; XWayland stays reachable through DISPLAY.
[Service]
Environment=WAYLAND_DISPLAY=wayland-0
Environment=DISPLAY=:0
Environment=XDG_SESSION_TYPE=wayland
Environment=XDG_CURRENT_DESKTOP=KDE
Environment=XDG_RUNTIME_DIR=%t
