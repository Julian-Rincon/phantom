[package]
name = "phantom-island"
description = "Phantom Island — a live view of your Phantom agent sessions at the top of the screen"
authors = ["Julian Rincon"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "phantom_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# WS client to codeg-server's /ws/events — same attach protocol the web
# frontend speaks (see src/lib/transport/web-transport.ts upstream).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Linux secret storage: GNOME Keyring / KWallet via the Secret Service D-Bus
# API. Matches the feature codeg's own desktop build uses on Linux.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# X11 pointer polling for the "peek on hover" gesture under XWayland — see
# island.rs module docs for why this is X11-only and what the fallback is.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "shape"] }
raw-window-handle = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[features]
# Embed the built frontend (dist/) instead of loading the Vite dev server.
# `tauri build` enables it; plain `cargo build` must pass it explicitly.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
